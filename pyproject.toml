[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl_verify_platform"
version = "0.1.0"
description = "AI-powered RTL Verification & Waveform Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyqt6>=6.6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "openai>=1.12.0",
    "transformers>=4.38.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
]

[project.scripts]
rtlverify = "rtl_verify_platform.cli.main:app"
